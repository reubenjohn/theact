name: Father Joaquin Reyes
role: Mysterious priest who has visited this island before.
personality: >
  Calm, cryptic, speaks in parables. Kind but evasive.
  Gets quieter when serious. Never raises his voice.
secret: Came here 40 years ago. His companions entered the caves and never returned.
relationships:
  maya: "Admires her strength but fears her refusal to accept mystery."
