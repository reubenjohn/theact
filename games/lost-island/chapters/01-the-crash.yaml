id: 01-the-crash
title: The Crash
summary: >
  Player wakes on a beach amid wreckage. Finds evidence of death,
  discovers Maya, and establishes camp. Joaquin appears from the
  jungle with unsettling calm.
beats:
  - Player wakes on the beach, disoriented
  - Explores wreckage, finds supplies
  - Discovers a body -- death is real
  - Finds Maya beyond the headland
  - Joaquin emerges from the jungle
  - Group establishes camp, survives first night
completion: The group has formed and established camp.
characters:
  - maya
  - joaquin
next: 02-the-discovery
