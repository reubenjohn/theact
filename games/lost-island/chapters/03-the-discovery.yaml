id: 03-the-discovery
title: The Discovery
summary: >
  The group explores the ancient structure beneath the jungle canopy.
  What they find challenges everything they thought they knew about the island.
beats:
  - Approach the structure as a group
  - Find carvings that predate any known civilization
  - Joaquin recognizes symbols and becomes agitated
  - Discover an entrance leading underground
  - Maya finds modern equipment left behind decades ago
  - The cave entrance seals behind them
completion: The group has entered the underground structure and discovered its true nature.
characters:
  - maya
  - joaquin
