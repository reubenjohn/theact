site_name: TheAct
site_description: An AI-driven text-based RPG engine for small language models
site_url: https://reubenjohn.github.io/theact
repo_url: https://github.com/reubenjohn/theact
repo_name: reubenjohn/theact

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ['.']
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Core Concepts: concepts.md
  - Getting Started: getting-started.md
  - Architecture:
    - Overview: architecture/overview.md
    - Data Model: architecture/data-model.md
    - Agents: architecture/agents.md
    - Memory & Summarization: architecture/memory.md
    - Save Versioning: architecture/save-versioning.md
  - Guides:
    - Creating a Game: guides/creating-a-game.md
    - Playtesting: guides/playtesting.md
    - Debugging: guides/debugging.md
    - Prompt Engineering: guides/prompt-engineering.md
  - Reference:
    - Observability: reference/observability.md
    - Game Creation Pipeline: reference/game-creation-pipeline.md
    - Requirements & Rationale: reference/requirements.md
  - Plans:
    - Overview: plans/README.md
    - Phase 01 - Data Model: plans/01-DataModelAndProjectStructure.md
    - Phase 02 - LLM Client: plans/02-LLMClientAndInference.md
    - Phase 03 - Turn Engine: plans/03-TurnEngineMemoryAndSummarization.md
    - Phase 04 - Rich CLI: plans/04-RichCLI.md
    - Phase 05 - Example Game: plans/05-ExampleGameAndPlaytest.md
    - Phase 06 - Game Creator: plans/06-GameCreationAgent.md
    - Phase 07 - Web UI: plans/07-WebUI.md
    - Phase 08 - Documentation: plans/08-Documentation.md
    - Phase 09 - Observability: plans/09-ObservabilityAndDiagnostics.md
    - Phase 10 - Save Versioning: plans/10-SaveVersioningAndTurnDebugger.md
    - Phase 11 - Small Model Hardening: plans/11-SmallModelHardening.md
    - Phase 12 - Creator Hardening: plans/12-CreatorSmallModelHardening.md
