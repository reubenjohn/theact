[project]
name = "theact"
version = "0.1.0"
description = "AI text-based RPG engine designed for small language models"
readme = "README.md"
license = "MIT"
authors = [{ name = "Reuben John", email = "reubenvjohn@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "gitpython>=3.1.46",
    "openai>=2.29.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
]

[project.urls]
Homepage = "https://github.com/reubenvjohn/theact"
Repository = "https://github.com/reubenvjohn/theact"
Issues = "https://github.com/reubenvjohn/theact/issues"

[project.optional-dependencies]
web = [
    "nicegui>=3.9.0",
    "filelock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theact"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "pytest-playwright>=0.7.2",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["theact"]
omit = [
    "src/theact/cli/*",
    "src/theact/web/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true
