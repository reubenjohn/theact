[project]
name = "theact"
version = "0.1.0"
description = "AI text-based RPG engine designed for small language models"
readme = "README.md"
license = "MIT"
authors = [{ name = "Reuben John", email = "reubenvjohn@gmail.com" }]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/reubenvjohn/theact"
Repository = "https://github.com/reubenvjohn/theact"
Issues = "https://github.com/reubenvjohn/theact/issues"
dependencies = [
    "gitpython>=3.1.46",
    "openai>=2.29.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
]

[project.optional-dependencies]
web = [
    "nicegui>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theact"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "pytest-playwright>=0.7.2",
]
